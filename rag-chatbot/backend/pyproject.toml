[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    "__pycache__",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Enable all rule groups.
select = ["E", "F", "B", "I", "UP", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
